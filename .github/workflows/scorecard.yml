name: Scorecard

# OpenSSF Scorecard: an automated, publicly verifiable score covering
# supply-chain security practices (pinned dependencies, branch protection,
# CI tests, vulnerability response, etc.) — see the badge in README.md.
# Only produces a public score for public repositories; for a private
# repo this still runs but `publish_results` should be set to false below.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
